<!DOCTYPE html><html lang="ja">
<head>
	<meta charset="utf-8" />
	<title>Switchbot API</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Cache-Control" content="no-cache">
	<meta http-equiv="Expires" content="0">
	<meta http-equiv="refresh" content="300">
	<link rel="preconnect" href="https://github.com">
	<link rel="dns-prefetch" href="https://github.com">
	<link rel="preconnect" href="https://n138-kz.github.io">
	<link rel="dns-prefetch" href="https://n138-kz.github.io">
	<link rel="stylesheet" type="text/css" href="https://n138-kz.github.io/lib/master.css?t=0" />
	<script src="https://n138-kz.github.io/lib/master.js"></script>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="https://accounts.google.com/gsi/client" async defer></script>
	<script src="https://www.google.com/recaptcha/api.js?render=6LfCHdcUAAAAAOwkHsW_7W7MfoOrvoIw9CXdLRBA"></script>
	<script src="https://n138-kz.github.io/lib/grecaptcha.js"></script>
	<style>
		img {
			max-width: 80%;
		}
		input.set-mosaic:invalid {
			filter: none;
		}
		.switchbotapi {
			width: 200px;
			margin: 0 auto;
		}
		.switchbotapi p {
			margin-top: 0.5em;
			margin-bottom: 0;
		}
		.switchbotapi input {
			display: block;
			width: 80%;
			margin: 0 auto;
		}
		.switchbotapi img {
			display: block;
			margin: 0 auto;
			margin-top: 0.5em;
			height: 2.5em;
			cursor: pointer;
		}
	</style>
	<script src="assets/crypto-js-4.2.0/crypto-js.js"></script>
	<script src="assets/crypto-js-4.2.0/core.js"></script>
	<script src="assets/crypto-js-4.2.0/hmac.js"></script>
	<script src="assets/crypto-js-4.2.0/hmac-sha256.js"></script>
	<script src="assets/crypto-js-4.2.0/sha256.js"></script>
	<script>
		window.addEventListener('DOMContentLoaded', ()=>{
			init_setTopMaker()
			init_setFavicon()
			init_setHeaderText()
		})
		function load_api_credential() {
			api_credential_token = document.querySelector('#api_credential_token')
			api_credential_secret = document.querySelector('#api_credential_secret')
			config = localStorage.getItem( (btoa(location.href)).slice(0, 16) + '.' + 'api_credential' );
			config = config?JSON.parse(config):{api_credential:{token:'',secret:''}}
			api_credential_token.value=config.api_credential.token
			api_credential_secret.value=config.api_credential.secret
		}
		window.addEventListener('load', ()=>{load_api_credential()})
		function store_api_credential(caller=null) {
			try {
				console.log(caller.parentNode);
				api_credential_token = document.querySelector('#api_credential_token')
				api_credential_secret = document.querySelector('#api_credential_secret')
				config = JSON.stringify({
					api_credential: {
						token: api_credential_token.value,
						secret: api_credential_secret.value,
					}
				})
				localStorage.setItem( (btoa(location.href)).slice(0, 16) + '.' + 'api_credential', config );
				syncStorage(localStorage,sessionStorage);

				result = document.createElement('div')
				result.innerText = 'Credential cached'
				result.classList.add('disappearance_at5s')
				caller.parentNode.appendChild(result)
				setTimeout(()=>{
					Array.from(document.querySelectorAll('.disappearance_at5s')).map((e)=>{
						e.remove()
					})
				}, 5000)
			} catch (error) {
				console.error(error);
			}
		}
		function getTextEncoding(text) {
			const enc = new TextEncoder('utf-8');
			return enc.encode(text);
		}
		function genAuthnParams(token, secret) {
			credential = [token, secret];
			credential = JSON.stringify(credential);
			credential = btoa(credential);
			return credential;
		}
		async function getDevicesList() {
			const api_credential_token = document.querySelector('#api_credential_token').value
			const api_credential_secret = document.querySelector('#api_credential_secret').value
			const x_token = genAuthnParams(api_credential_token, api_credential_secret)
			let query_params = new URLSearchParams({'x-token': x_token,accessmode:'devices_list',})
			let api_url = 'https://api.n138.jp/switchbot/server/?'+query_params;

			request = await fetch(api_url, {
				method: 'GET',
				mode: 'cors',
			});
			response = await request;
			if(response.headers.get('content-type').split(';')[0].toLocaleLowerCase()=='application/json'){
				response = await response.json();
				
				Array.from(document.querySelectorAll('.switchbotapi_devices_list')).map((e)=>{
					console.log(e);
					e.remove();
				});

				console.log(response.data[response.data_id]);
				let table=document.createElement('table');
				table.classList.add('switchbotapi_devices_list');
				columns=['deviceName','deviceType'];
				let line=null, item=null;
				line=document.createElement('tr');
				for(let i=0;i<columns.length;i++){
					item=document.createElement('th');
					item.innerText=columns[i];
					line.appendChild(item);
				}
				table.appendChild(line);
				for(let i=0;i<response.data[response.data_id].length;i++){
					line=document.createElement('tr');
					item=document.createElement('td');
					item.innerText=response.data[response.data_id][i]['deviceName'];
					item.dataset.deviceId=response.data[response.data_id][i]['deviceId']
					item.dataset.deviceType=response.data[response.data_id][i]['deviceType']
					item.dataset.hubDeviceId=response.data[response.data_id][i]['hubDeviceId']
					item.dataset.version=response.data[response.data_id][i]['version']?response.data[response.data_id][i]['version']:null
					
					item.dataset.electricCurrent=response.data[response.data_id][i]['electricCurrent']?response.data[response.data_id][i]['electricCurrent']:null
					item.dataset.electricityOfDay=response.data[response.data_id][i]['electricityOfDay']?response.data[response.data_id][i]['electricityOfDay']:null
					item.dataset.power=response.data[response.data_id][i]['power']?response.data[response.data_id][i]['power']:null
					item.dataset.voltage=response.data[response.data_id][i]['voltage']?response.data[response.data_id][i]['voltage']:null
					
					item.dataset.temperature=response.data[response.data_id][i]['temperature']?response.data[response.data_id][i]['temperature']:null
					item.dataset.humidity=response.data[response.data_id][i]['humidity']?response.data[response.data_id][i]['humidity']:null

					item.dataset.battery=response.data[response.data_id][i]['battery']?response.data[response.data_id][i]['battery']:null

					item.dataset.moveDetected=response.data[response.data_id][i]['moveDetected']?response.data[response.data_id][i]['moveDetected']:null

					line.appendChild(item);
					item=document.createElement('td');
					item.innerText=response.data[response.data_id][i]['deviceType'];
					line.appendChild(item);
					table.appendChild(line);
				}

				Array.from(document.querySelectorAll('.switchbotapi_devices')).map((e)=>{
					console.log(e);
					e.after(table);
				});
			}
		}
		Array.from(document.querySelectorAll('.switchbotapi_devices img[src$=".svg" i]')).map((e)=>{
			console.log(e);
			e.addEventListener('click', async ()=>{
				await getDevicesList();
			})
		});
	</script>
</head><body>
<div>
	<div>
		<h2>Switchbot API Credential</h2>
		<div class="switchbotapi switchbotapi_credential">
			<p>Token</p>
			<input type="text" class="set-mosaic" id="api_credential_token" placeholder="Switchbot API Token" required onclick="this.select();">
			<p>Secret</p>
			<input type="text" class="set-mosaic" id="api_credential_secret" placeholder="Switchbot API Secret" required onclick="this.select();">
			<img src="assets/icooonmono15417.svg" onclick="store_api_credential(this);">
		</div>
	</div>
	<div>
		<h2>Switchbot API Devices</h2>
		<div class="switchbotapi switchbotapi_devices">
			<p>Get list</p>
			<img src="assets/icooonmono11481.svg">
		</div>
	</div>
</div>
</body>
</html>
